[project]
name = "digital-twin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arianne Tan", email = "aj.yannie@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.26.0",
    "openai-agents>=0.22.0",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
digital-twin = "digital_twin:main"

[tool.vercel]
entrypoint = "src.app:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
